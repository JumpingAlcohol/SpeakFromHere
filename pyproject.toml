[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat-reader"
version = "0.2.0"
description = "A lightweight Windows reader for selected text and verified AI reply paragraphs."
requires-python = ">=3.11"
dependencies = [
    "pyperclip>=1.9,<2.0",
    "pynput>=1.8,<2.0",
    "pywin32>=312,<313; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3; sys_platform == 'win32'"]
paragraph = ["comtypes>=1.4.17,<2; sys_platform == 'win32'"]

[tool.unittest]
start-directory = "tests"

[tool.setuptools.packages.find]
where = ["src"]
